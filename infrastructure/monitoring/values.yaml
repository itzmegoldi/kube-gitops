grafana:
  enabled: true

  adminPassword: admin123

  persistence:
    enabled: true

    size: 5Gi

prometheus:
  prometheusSpec:
    retention: 15d

    resources:
      requests:
        cpu: 500m

        memory: 1Gi

      limits:
        cpu: 2

        memory: 4Gi

alertmanager:
  enabled: true
