apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:
  name: monitoring

  namespace: argocd

spec:
  source:
    repoURL: https://github.com/itzmegoldi/kube-gitops

    path: infrastructure/monitoring

  destination:
    server: https://kubernetes.default.svc

    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  syncOptions:
    - CreateNamespace=true
