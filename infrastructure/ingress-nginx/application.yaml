apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ingress-nginx
  namespace: argocd

spec:
  source:
    repoURL: https://github.com/YOUR_USER/k8s-gitops

    path: infrastructure/ingress-nginx

  destination:
    server: https://kubernetes.default.svc

    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
