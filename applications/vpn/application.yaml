apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: vpn
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/itzmegoldi/kube-gitops
    targetRevision: main
    path: applications/vpn

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
